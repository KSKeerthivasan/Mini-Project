<!DOCTYPE html>
<html>
<head>
<title>Local Humanizer</title>
<style>
body{background:#111;color:white;font-family:Arial;max-width:850px;margin:50px auto;padding:20px}
textarea{width:100%;height:220px;background:#222;color:white;padding:15px;border:1px solid #555;border-radius:10px;font-size:16px;box-sizing:border-box}
button{padding:13px 25px;margin:15px 0;background:white;color:#111;border:0;border-radius:8px;cursor:pointer;font-size:16px}
#output{white-space:pre-wrap;background:#222;padding:20px;border-radius:10px;min-height:100px}
</style>
</head>
<body>
<h1>Local Humanizer</h1>
<p>Paste your text below</p>
<textarea id="input" placeholder="Paste your text here..."></textarea>
<br><button onclick="humanize()">Humanize Text</button>
<h2>Rewritten Text</h2>
<div id="output">Your result will appear here.</div>
<script>
async function humanize(){
const draft=document.getElementById('input').value.trim();
if(!draft)return alert('Enter some text first');
const out=document.getElementById('output');
out.textContent='Humanizing...';
const prompt="Rewrite the text below so it reads like a person wrote it, not a language model.\n\nReorganize it as you see fit. Vary sentence length on purpose. Cut hedging, throat-clearing, and any sentence that only announces what comes next.\nPrefer the concrete word over the abstract one. It is fine to sound uneven.\n\nEvery fact, number, unit, date, name and quotation must survive unchanged.\n\n"+draft+"\n\n### Rewritten:";
try{
const r=await fetch('http://127.0.0.1:8080/completion',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,temperature:1,top_p:0.95,top_k:0,repeat_penalty:1,n_predict:2048})});
const d=await r.json();
out.textContent=d.content||JSON.stringify(d);
}catch(e){out.textContent='Error: '+e.message;}
}
</script>
</body>
</html>
